<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swim Hub</title>
<meta name="application-name" content="Swim Hub">
<meta name="apple-mobile-web-app-title" content="Swim Hub">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a2a47">
<meta name="description" content="Swim Hub: season planning, workouts, distances by training zone and swimmer tracking for swim coaches.">
<style>
:root{--bg:#f2f5f9;--card:#fff;--tx:#0f1b2a;--mu:#66768a;--nv:#0a2a47;--bl:#1760a5;--sk:#38a6e0;--gr:#e9eef3;--bd:#d9e1e9;--bad:#c0392b;--sh:0 1px 2px rgba(10,42,71,.06),0 4px 14px rgba(10,42,71,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b131b;--card:#14202b;--tx:#e7eef5;--mu:#8da0b3;--nv:#0a2239;--bl:#5aaeea;--sk:#5cc0f2;--gr:#1e2c39;--bd:#25354a;--bad:#ff7b6b;--sh:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b131b;--card:#14202b;--tx:#e7eef5;--mu:#8da0b3;--nv:#0a2239;--bl:#5aaeea;--sk:#5cc0f2;--gr:#1e2c39;--bd:#25354a;--bad:#ff7b6b;--sh:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--nv);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--nv);z-index:5;padding:12px 14px 0}
.bar{display:flex;justify-content:space-between;align-items:center;min-height:40px}
#ttl{color:#fff;font-weight:700;font-size:16px;letter-spacing:.2px}
.cloud-btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:700;min-height:36px}#burger{width:42px;height:42px;border:0;background:rgba(255,255,255,.1);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0}
#burger i{display:block;width:20px;height:2px;background:#fff;border-radius:1px;transition:.2s}
#burger.open i:nth-child(1){transform:translateY(7px) rotate(45deg)}
#burger.open i:nth-child(2){opacity:0}
#burger.open i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mb{position:fixed;inset:0;z-index:6;background:rgba(10,34,57,.28)}
.mp{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:7;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);min-width:220px;padding:6px;display:flex;flex-direction:column}
.mi{background:none;border:0;border-left:3px solid transparent;text-align:left;padding:12px 14px;border-radius:8px;color:var(--tx);font:inherit;font-weight:600}
.mi.on{border-left-color:var(--sk);background:var(--gr);color:var(--bl)}
.hero{min-height:calc(100vh - 120px);min-height:calc(100dvh - 120px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 10px}
.hn{font-size:clamp(40px,12vw,76px);line-height:1.05;margin:0;color:var(--tx);font-weight:300;letter-spacing:-.02em}
.hn b{font-weight:800}
.hl{width:64px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--bl),var(--sk));margin:22px 0 18px}
.hs{margin:0;max-width:440px;color:var(--mu);font-size:clamp(14px,3.6vw,17px);line-height:1.6}
main{padding:14px;max-width:920px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:var(--sh)}
h2{font-size:12px;margin:0 0 12px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.07em}
h3{font-size:12px;margin:18px 0 10px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px;font-weight:600}
input,select,textarea{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sk);outline-offset:-1px}
button{font:inherit;cursor:pointer}
.pri,.sec,.dng,.ok,.rd{border-radius:8px;padding:9px 14px;font-weight:600;margin:10px 8px 0 0}
.pri{background:var(--bl);color:#fff;border:1px solid var(--bl)}
.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.dng{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.x{background:none;border:0;color:var(--mu);font-size:17px;padding:2px 8px}
.x:disabled{opacity:.3;cursor:default}
.sa{display:flex;gap:6px;align-items:center;margin-top:8px}
.sa select{width:auto;flex:1;max-width:260px;padding:6px 8px;font-size:13px}
.mu{color:var(--mu);font-size:12px}
.lk{background:none;border:1px dashed var(--bd);color:var(--bl);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;box-shadow:var(--sh)}
summary{padding:13px 14px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
summary::-webkit-details-marker{display:none}
.days{padding:0 12px 12px;display:grid;gap:10px}
.day{border:1px solid var(--bd);border-radius:10px;padding:10px}
.dh{display:flex;justify-content:space-between;margin-bottom:8px}
.en{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.en select{flex:2}.en input{flex:1}
.wk{border-bottom:1px solid var(--bd);padding:6px 2px;font-size:14px}
.zn{font-weight:700;letter-spacing:.02em}
.grp{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;margin-bottom:16px;box-shadow:var(--sh);overflow:hidden}
.gbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding:12px 14px;background:var(--gr);border-bottom:1.5px solid var(--bd)}
.gname{flex:1;min-width:150px}.grd{width:78px}
.gname input{font-weight:700;font-size:16px}
.gtot{font-weight:700;color:var(--bl);padding-bottom:9px;white-space:nowrap}
.ctl{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap}
.dng.sm{margin:0;padding:6px 10px;font-size:12px;background:#d93025;border-color:#d93025;color:#fff}
.rd{background:#d93025;border:1px solid #d93025;color:#fff}
.tri2{display:flex;gap:8px;margin-top:10px;align-items:stretch;flex-wrap:nowrap}
.tri2 button{flex:1;margin:0;padding:10px 6px;font-size:13px;line-height:1.25}
.ok{background:#1e8e5a;border:1px solid #1e8e5a;color:#fff}
.gfoot .ok{margin:0;padding:10px 14px}
.mvs{width:auto;max-width:132px;padding:5px 6px;font-size:12px}
.sh{flex-wrap:wrap}
.ib{width:34px;height:34px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font-size:16px;line-height:1;padding:0}
.ib:disabled{opacity:.35;cursor:default}
.mnu{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--bd)}
.mnu select{width:auto;flex:1;min-width:150px}
.mnu .pri,.mnu .sec,.mnu .dng{margin:0;padding:7px 12px;font-size:13px}
.gsets{padding:12px;display:grid;gap:12px}
.set{border:1.5px solid var(--bd);border-left:4px solid var(--sk);border-radius:10px;background:var(--card);overflow:hidden}
.sh{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-bottom:1px solid var(--bd);background:var(--bg)}
.sn{font-weight:700;font-size:13px}.stt{color:var(--mu);font-size:12px}
.sb{padding:10px 12px 12px}
.addset{display:block;width:calc(100% - 24px);margin:0 12px 12px;border:1.5px dashed var(--bd);background:none;color:var(--bl);padding:10px;border-radius:10px;font-weight:600}
.gfoot{display:flex;gap:8px;padding:0 12px 12px;flex-wrap:wrap;align-items:center}
.gfoot .addset{flex:1;min-width:110px;width:auto;margin:0}
.gfoot .sec,.gfoot .dng{margin:0;padding:10px 14px}
.addgrp{display:block;width:100%;border:1.5px dashed var(--bl);background:none;color:var(--bl);padding:12px;border-radius:12px;font-weight:700;margin-bottom:14px}
.wt{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--mu);font-weight:600}.wt b{font-size:24px;color:var(--bl)}
.sr{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:8px}
.st{display:flex;gap:4px}.st button{width:36px;border:0;border-radius:8px;background:var(--bl);color:#fff;font-size:18px}
.st input{text-align:center}
.tm{display:flex;gap:4px;align-items:center}
.gh{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
th,td{border-bottom:1px solid var(--bd);padding:8px 6px;text-align:center;white-space:nowrap}
th{color:var(--mu);font-weight:700;font-size:12px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kp div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;font-size:12px;color:var(--mu);font-weight:600;box-shadow:var(--sh)}
.kp b{display:block;font-size:22px;color:var(--bl);margin-top:2px}
.br{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
.br span:first-child{width:128px;font-weight:600}.br span:last-child{width:72px;text-align:right}
.br i{display:block;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bl),var(--sk))}
.br div{flex:1;background:var(--gr);border-radius:5px}
.out{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-bottom:14px;box-shadow:var(--sh)}
.out.sel{border-color:var(--sk);box-shadow:0 0 0 2px var(--sk)}
.oh{background:linear-gradient(135deg,var(--nv),var(--bl));color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center}
.ot{font-size:18px;font-weight:700}.od{opacity:.85;font-size:13px;margin-top:2px}.om{font-size:28px;font-weight:700}.om small{font-size:13px;margin-left:3px;font-weight:600}
.ogh{background:var(--gr);padding:9px 16px;display:flex;justify-content:space-between;font-weight:700;font-size:13px}
.os{padding:11px 16px;border-bottom:1px solid var(--bd)}
.osr{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.osm{font-size:17px;font-weight:700;min-width:104px}
.tt{color:var(--bl);font-weight:700}
.sm{margin-left:auto;color:var(--mu);font-size:12px}
.on{color:var(--mu);font-size:13px;margin-top:4px;white-space:pre-wrap}
.oa{padding:4px 12px 14px;display:flex;gap:2px;flex-wrap:wrap;align-items:center}
.ed{border-left:4px solid var(--sk)}
.sbar{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:8px}
.ios{background:#f2f2f7;color:#000;max-width:1100px;margin:0 auto 20px;border-radius:14px;padding:18px 16px 20px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif}
.ilb{font-size:10px;font-weight:700;letter-spacing:.18em;color:#8e8e93}
.itt{font-size:28px;font-weight:700;letter-spacing:-.01em;margin-top:6px}
.isub{font-size:13px;color:#8e8e93;margin-top:2px}
.ist{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-radius:10px;margin:14px 0 8px}
.ist div{padding:10px 14px;border-right:1px solid #e5e5ea}.ist div:last-child{border:0}
.ist b{display:block;font-size:20px;font-weight:700}.ist span{font-size:11px;color:#8e8e93}
.izs{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:11.5px;color:#3c3c43;margin:0 4px 4px}
.isc{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;color:#6c6c70;text-transform:uppercase;letter-spacing:.04em;padding:14px 6px 6px}
.icd{background:#fff;border-radius:10px;overflow:hidden}
.irw{display:grid;grid-template-columns:104px 76px minmax(0,1fr) auto auto;gap:2px 10px;align-items:baseline;padding:9px 14px;position:relative}
.irw+.irw::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:#e5e5ea}
.ir1{font-size:14.5px;font-weight:700}.ir2{font-size:12.5px;font-weight:600}.ir3{font-size:12px;color:#3c3c43;overflow-wrap:anywhere}.ir4{font-size:12.5px;font-weight:700;color:#1760a5}.ir5{font-size:12px;color:#8e8e93;text-align:right}
.irn{grid-column:2/-1;font-size:11.5px;color:#6c6c70;white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:560px){.irw{grid-template-columns:88px 58px minmax(0,1fr) auto auto;gap:2px 6px;padding:8px 10px}.ir1{font-size:13.5px}.itt{font-size:24px}.ios{padding:14px 10px 16px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#0a2a47;color:#fff;padding:11px 18px;border-radius:10px;z-index:20;font-size:14px;display:none;max-width:90%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
@media (max-width:560px){.ist b{font-size:16px}.ist div{padding:8px 8px}}
:root{--gr2:#d6dee7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gr2:#2a3c4f}}
:root[data-theme="dark"]{--gr2:#2a3c4f}
.grp{background:var(--gr)}
.gbar{background:var(--gr2)}
.ib.up{background:#0a2a47;border-color:#0a2a47;color:#fff}
.ib.dn{background:#a9dcf5;border-color:#a9dcf5;color:#0a2a47}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ib.up{border-color:#3b7fc0}}
:root[data-theme="dark"] .ib.up{border-color:#3b7fc0}
.ib.up,.ib.up:disabled{background:#0a2a47!important;opacity:1}
.ib.dn,.ib.dn:disabled{background:#a9dcf5!important;opacity:1}
.ib.up:disabled{color:rgba(255,255,255,.35);cursor:default}
.ib.dn:disabled{color:rgba(10,42,71,.3);cursor:default}
.pdfw{container-type:inline-size;width:min(100%,640px);margin:0 auto 20px}
.pv{--u:1px;font-size:calc(var(--u)*10);line-height:1.25;background:#f2f2f7;color:#000;border-radius:1.2em;padding:2.7em 1.4em 2em;font-family:Helvetica,Arial,sans-serif;box-shadow:0 8px 30px rgba(10,42,71,.18)}
@supports (width:1cqw){.pv{--u:.26316cqw}}
.pv *{box-sizing:border-box}
.pv-l{font-size:.75em;font-weight:700;color:#8e8e93;padding-left:.4em}
.pv-t{font-size:2.2em;font-weight:700;margin:.45em 0 0 .18em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-d{color:#8e8e93;margin:.5em 0 0 .4em}
.pv-s{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-radius:.8em;margin-top:1.2em;height:4.8em;align-items:center}

.pv-s span{font-size:.8em;color:#8e8e93}

.pv-c{background:#fff;border-radius:.8em;overflow:hidden}

.pv-r+.pv-r::before{content:"";position:absolute;top:0;left:1em;right:0;height:1px;background:#e5e5ea}
.pv-r .a{font-size:1.25em;font-weight:700;white-space:nowrap}
.pv-r .b{font-weight:700;white-space:nowrap}

.pv-r .d{font-weight:700;color:#1760a5;white-space:nowrap}
.pv-r .e{font-size:.95em;color:#8e8e93;text-align:right;white-space:nowrap}
.pv-r .n{grid-column:2/-1;font-size:.85em;color:#6c6c70;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:.3em}
.teams{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap;justify-content:center}

.mtm{display:flex;gap:6px;padding:6px 6px 10px;border-bottom:1px solid var(--bd);margin-bottom:6px}

.rd2{grid-column:1/-1;display:flex;align-items:flex-end;gap:6px}

.gcon .tm input{padding:7px 4px}
.os.rest{text-align:center;color:var(--mu);font-size:12px;padding:6px;background:var(--bg)}
.pv-rest{text-align:center;font-size:.8em;font-style:italic;color:#8e8e93;padding:.4em 0;background:#f7f7fa;border-top:1px solid #e5e5ea;border-bottom:1px solid #e5e5ea}
.pv-gr{text-align:center;font-size:.8em;font-style:italic;color:#8e8e93;padding:.9em 0 0}
.gbar{display:block;padding:12px 14px 14px;background:linear-gradient(90deg,#08223b 0%,#0f4a80 55%,#38a6e0 100%);border-bottom:0;color:#fff}

.gr1{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.gr2{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-top:10px}

.grp label,.set label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.gsets{padding:14px;gap:14px}
.sr{grid-template-columns:.8fr 1fr 1.3fr 1.3fr;gap:10px 12px}

.gridt{min-width:0;width:100%;table-layout:fixed;border-collapse:collapse}

.gnote{padding:10px 12px 0}
